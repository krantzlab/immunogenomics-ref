  last_literature_review: "2026-02-20"
  reviewer: MK
  primary_sources:
    - doi: "10.1182/blood-2014-09-599969"
      authors: "Petersdorf EW, Gooley TA, Malkki M, Bacigalupo AP, Cesbron A, Du Toit E, Ehninger G, Egeland T, Fischer GF, Gervais T, Haagenson MD, Horowitz MM, Hsu K, Jindra P, Madrigal A, Oudshoorn M, Ringden O, Schroeder ML, Spellman SR, Tiercy JM, Velardi A, Witt CS, O'Huigin C, Apps R, Carrington M"
      year: 2014
      journal: "Blood"
      volume: 124
      issue: 26
      pages: "3996-4003"
      contribution: "HLA-C allotype surface expression MFI values from Table 3; measured by flow cytometry across transplant donor/recipient pairs"
    - doi: "10.1126/science.1232685"
      authors: "Apps R, Qi Y, Carlson JM, Chen H, Gao X, Thomas R, Yuki Y, Del Prete GQ, Goulder P, Brumme ZL, Brumme CJ, John M, Mallal S, Nelson G, Bosch R, Heckerman D, Stein JL, Soderberg KA, Moody MA, Denny TN, Zeng X, Fang J, Moffett A, Lifson JD, Goedert JJ, Buchbinder S, Kirk GD, Fellay J, McLaren P, Deeks SG, Pereyra F, Walker B, Michael NL, Weintrob A, Wolinsky S, Liao W, Carrington M"
      year: 2013
      journal: "Science"
      volume: 340
      issue: 6128
      pages: "87-91"
